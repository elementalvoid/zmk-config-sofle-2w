# Uncomment the following line to enable the Sofle OLED Display
# CONFIG_ZMK_DISPLAY=y

# Encoder support comes from the devicetree 'alps,ec11' nodes in the upstream
# Sofle shield plus the 'zmk,keymap-sensors' node in sofle.keymap.
#
# CONFIG_EC11 is auto-selected via DT_HAS_ALPS_EC11_ENABLED, but the trigger
# mode must be chosen explicitly: the default is EC11_TRIGGER_NONE, which
# leaves the driver without interrupt support and encoders non-functional.
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment this line below to add rgb underglow / backlight support
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Uncomment the line below to disable external power toggling by the underglow.
# By default toggling the underglow on and off also toggles external power
# on and off. This also causes the display to turn off.
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enables a combination of settings that are planned to be default in future
# versions of ZMK to improve connection stability.
# Currently this only disables 2M PHY support.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Low level setting for GATT subscriptions.
# Set to n to work around an annoying Windows bug with battery notifications.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Mouse scrolling on encoder
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
